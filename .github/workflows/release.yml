name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: sethyrung-linux-x64
          - target: bun-linux-arm64
            asset: sethyrung-linux-arm64
          - target: bun-darwin-x64
            asset: sethyrung-darwin-x64
          - target: bun-darwin-arm64
            asset: sethyrung-darwin-arm64
          - target: bun-windows-x64
            asset: sethyrung-windows-x64.exe
          - target: bun-windows-arm64
            asset: sethyrung-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} --asset src/content src/main.ts --outfile ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
