<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Help — classic usage</title>
    <style>
      :root {
        --crust: #11111b;
        --mantle: #181825;
        --base: #1e1e2e;
        --surface: #313244;
        --overlay: #6c7086;
        --subtext: #a6adc8;
        --text: #cdd6f4;
        --blue: #89b4fa;
        --peach: #fab387;
        --green: #a6e3a1;
        --red: #f38ba8;
        --yellow: #f9e2af;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 600px at 50% -10%, #1e1e2e 0%, var(--crust) 55%);
        color: var(--text);
        font:
          14px/1.45 "JetBrains Mono",
          "Cascadia Code",
          "Fira Code",
          ui-monospace,
          monospace;
      }
      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }
      .assumption {
        color: var(--subtext);
        font-size: 12px;
        margin: 0 0 18px;
      }
      .term {
        background: var(--base);
        border: 1px solid var(--surface);
        border-radius: 12px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      .term-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: var(--mantle);
        border-bottom: 1px solid var(--surface);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .dot.r {
        background: var(--red);
      }
      .dot.y {
        background: var(--yellow);
      }
      .dot.g {
        background: var(--green);
      }
      .term-bar .title {
        flex: 1;
        text-align: center;
        color: var(--overlay);
        font-size: 12px;
      }
      .term-body {
        padding: 18px 20px 22px;
        overflow-x: auto;
      }
      .prompt {
        color: var(--overlay);
        margin-bottom: 14px;
      }
      .prompt .ps {
        color: var(--green);
      }
      pre.card {
        margin: 0;
        font: inherit;
        white-space: pre;
        color: var(--text);
      }
      .cmd {
        color: var(--blue);
      }
      .flag {
        color: var(--peach);
      }
      .label {
        color: var(--subtext);
      }
      .ok {
        color: var(--green);
      }
      #launchers {
        display: flex;
        gap: 8px;
        margin: 0 0 16px;
      }
      #launchers button {
        font: inherit;
        font-size: 12px;
        color: var(--subtext);
        background: var(--mantle);
        border: 1px solid var(--surface);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
      }
      #launchers button.active {
        color: var(--crust);
        background: var(--green);
        border-color: var(--green);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <p class="assumption">Classic <code>--help</code> only. Launcher is dynamic. Not a Screen.</p>
      <div id="launchers"></div>
      <div class="term">
        <div class="term-bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="title" id="title"></span>
        </div>
        <div class="term-body">
          <div class="prompt"><span class="ps">$</span> <span id="prompt"></span></div>
          <pre class="card" id="card"></pre>
        </div>
      </div>
    </div>
    <script>
      // Classic --help only. USAGE / COMMANDS / FLAGS. Launcher is dynamic.
      const PKG = "@sethyrung/portfolio";
      const LAUNCHERS = {
        npx: `npx ${PKG}`,
        bunx: `bunx ${PKG}`,
        binary: "sethyrung",
      };
      const COMMANDS = [
        { argv: "(none)", meaning: "Dev Card" },
        { argv: "about", meaning: "Bio" },
        { argv: "work [role]", meaning: "Work index, or a Role" },
        { argv: "projects [project]", meaning: "Projects index, or a Project" },
      ];
      const FLAGS = [
        { argv: "-h, --help", meaning: "Show usage" },
        { argv: "-v, --version", meaning: "Show version" },
      ];

      function esc(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }
      function vis(s) {
        return String(s).replace(/<[^>]+>/g, "").length;
      }
      function pad(s, n) {
        const v = vis(s);
        if (v >= n) return s;
        return s + " ".repeat(n - v);
      }
      function S(cls, s) {
        return `<span class="${cls}">${esc(s)}</span>`;
      }

      function currentLauncher() {
        const raw = new URLSearchParams(location.search).get("bin") ?? "npx";
        return raw in LAUNCHERS ? raw : "npx";
      }

      function setLauncher(key) {
        const url = new URL(location.href);
        url.searchParams.set("bin", key);
        history.replaceState(null, "", url);
        paint();
      }

      function paint() {
        const key = currentLauncher();
        const bin = LAUNCHERS[key];
        const invoke = `${bin} --help`;
        const row = (cls, item) => "  " + pad(S(cls, item.argv), 24) + S("label", item.meaning);
        document.getElementById("title").textContent = invoke;
        document.getElementById("prompt").textContent = invoke;
        document.getElementById("card").innerHTML = [
          S("ok", "USAGE"),
          "  " + S("cmd", bin + " [command]"),
          "",
          S("ok", "COMMANDS"),
          ...COMMANDS.map((c) => row("cmd", c)),
          "",
          S("ok", "FLAGS"),
          ...FLAGS.map((f) => row("flag", f)),
        ].join("\n");
        document.querySelectorAll("#launchers button").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.bin === key);
        });
      }

      const bar = document.getElementById("launchers");
      for (const [key, bin] of Object.entries(LAUNCHERS)) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.dataset.bin = key;
        btn.textContent = bin;
        btn.onclick = () => setLauncher(key);
        bar.append(btn);
      }
      paint();
    </script>
  </body>
</html>
